<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Push pin" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="head" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff6f60"/>
      <stop offset="0.55" stop-color="#e53935"/>
      <stop offset="1" stop-color="#9f1d1b"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" x2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#8b9099"/>
    </linearGradient>
  </defs>
  <!-- shadow on the surface -->
  <ellipse cx="22" cy="58" rx="9" ry="2.6" fill="#000" opacity="0.2"/>
  <g transform="rotate(30 32 32)">
    <!-- needle -->
    <path d="M30 38h4l-2 24z" fill="url(#needle)"/>
    <!-- flange (flat base) -->
    <rect x="14" y="30" width="36" height="8" rx="4" fill="#b71c1c"/>
    <rect x="14" y="30" width="36" height="3.5" rx="1.75" fill="#d32f2f"/>
    <!-- neck -->
    <rect x="22" y="18" width="20" height="14" rx="2" fill="#c62828"/>
    <!-- domed head -->
    <path d="M18 20c0-9 6-16 14-16s14 7 14 16z" fill="url(#head)"/>
    <!-- gloss highlight -->
    <path d="M23 15c1-5 4-8 8-9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>